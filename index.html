<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="color-scheme" content="light">
  <title>Private family strategy</title>
  <style>
    :root {
      --paper: #fbfaf6;
      --paper-deep: #f2f0e8;
      --ink: #1d2622;
      --muted: #66716b;
      --accent: #285f4b;
      --accent-dark: #173e31;
      --accent-soft: #e8f0eb;
      --line: #d9ddd8;
      --white: #fff;
      --warm: #8d5d2f;
      --shadow: 0 18px 50px rgba(38, 48, 42, .10);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 17px/1.68 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-rendering: optimizeLegibility;
    }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:hover { color: var(--accent-dark); }
    button, input { font: inherit; }
    .login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 14% 15%, rgba(40, 95, 75, .12), transparent 34%),
        radial-gradient(circle at 88% 82%, rgba(141, 93, 47, .10), transparent 30%),
        var(--paper);
    }
    .login-card {
      width: min(100%, 460px);
      padding: clamp(28px, 6vw, 46px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255,255,255,.88);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .login h1 {
      margin: 0 0 12px;
      font: 700 clamp(2rem, 7vw, 2.7rem)/1.08 Georgia, "Times New Roman", serif;
      letter-spacing: -.035em;
    }
    .login-copy { margin: 0 0 26px; color: var(--muted); }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    .password-row { display: flex; gap: 10px; }
    input {
      min-width: 0;
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #abb5af;
      border-radius: 10px;
      background: var(--white);
      color: var(--ink);
      outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(40, 95, 75, .13); }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      background: var(--accent);
      color: var(--white);
      font-weight: 750;
      cursor: pointer;
    }
    button:hover { background: var(--accent-dark); }
    button:disabled { cursor: wait; opacity: .65; }
    .status { min-height: 1.7em; margin: 12px 0 0; color: #a43c32; font-size: .92rem; }
    .privacy-note { margin: 20px 0 0; color: var(--muted); font-size: .82rem; }
    .reader[hidden], .login[hidden] { display: none; }
    .topbar {
      position: sticky;
      z-index: 20;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(251, 250, 246, .92);
      backdrop-filter: blur(12px);
    }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand strong { font-family: Georgia, "Times New Roman", serif; font-size: 1.05rem; }
    .brand span { color: var(--muted); font-size: .78rem; }
    .lock-button { padding: 7px 11px; background: transparent; color: var(--muted); font-size: .82rem; }
    .lock-button:hover { background: var(--accent-soft); color: var(--accent-dark); }
    .reading-layout {
      display: grid;
      grid-template-columns: minmax(190px, 260px) minmax(0, 820px);
      gap: clamp(30px, 5vw, 70px);
      max-width: 1220px;
      margin: 0 auto;
      padding: 46px 32px 100px;
    }
    .toc-panel { position: relative; }
    .toc {
      position: sticky;
      top: 92px;
      max-height: calc(100vh - 120px);
      overflow: auto;
      padding-right: 18px;
      scrollbar-width: thin;
    }
    .toc-title { margin: 0 0 12px; color: var(--muted); font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .toc ol { margin: 0; padding: 0; list-style: none; }
    .toc li { margin: 4px 0; }
    .toc li.level-3 { padding-left: 14px; font-size: .84rem; }
    .toc a { display: block; padding: 5px 7px; border-radius: 7px; color: var(--muted); line-height: 1.32; text-decoration: none; }
    .toc a:hover { background: var(--accent-soft); color: var(--accent-dark); }
    article { min-width: 0; }
    article > h1 {
      max-width: 760px;
      margin: 0 0 42px;
      font: 700 clamp(2.65rem, 7vw, 4.9rem)/.98 Georgia, "Times New Roman", serif;
      letter-spacing: -.055em;
    }
    h2 {
      margin: 74px 0 24px;
      padding-top: 8px;
      font: 700 clamp(1.8rem, 4vw, 2.5rem)/1.15 Georgia, "Times New Roman", serif;
      letter-spacing: -.025em;
    }
    h2:first-of-type { margin-top: 0; }
    h3 { margin: 48px 0 16px; font-size: 1.25rem; line-height: 1.28; letter-spacing: -.012em; }
    h4 { margin: 32px 0 12px; font-size: 1rem; }
    p { margin: 0 0 1.1em; }
    li { margin: .42em 0; }
    strong { font-weight: 750; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 48px 0; }
    .table-shell { width: 100%; margin: 22px 0 32px; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--white); box-shadow: 0 7px 22px rgba(38,48,42,.045); }
    table { width: 100%; min-width: 570px; border-collapse: collapse; font-size: .93rem; font-variant-numeric: tabular-nums; }
    th, td { padding: 11px 13px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    th { background: var(--paper-deep); color: #39423e; font-size: .78rem; letter-spacing: .025em; text-align: left; }
    th:first-child, td:first-child { width: 64px; text-align: center; }
    th:last-child, td:last-child { text-align: right; white-space: nowrap; }
    tbody tr:has(strong) { background: #f7f9f7; }
    .recommendation-block {
      margin: 18px 0;
      padding: 16px 18px;
      border-left: 3px solid var(--line);
      border-radius: 0 9px 9px 0;
      background: rgba(255,255,255,.55);
    }
    .recommendation-block.answer { border-color: var(--accent); background: var(--accent-soft); }
    .recommendation-block.action { border-color: var(--warm); }
    .recommendation-block.detail { border-color: transparent; padding-top: 0; padding-bottom: 0; background: transparent; color: var(--muted); font-size: .9rem; }
    .recommendation-block p { margin: 0; }
    blockquote { margin: 26px 0; padding: 4px 20px; border-left: 3px solid var(--accent); color: #45514b; }
    code { padding: .15em .35em; border-radius: 4px; background: var(--paper-deep); font-size: .88em; }
    .mobile-toc { display: none; }
    .footer { margin-top: 80px; padding-top: 22px; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; }
    @media (max-width: 850px) {
      body { font-size: 16px; line-height: 1.65; }
      .reading-layout { display: block; padding: 28px 18px 72px; }
      .toc-panel { display: none; }
      .mobile-toc { display: block; margin-bottom: 30px; padding: 13px 15px; border: 1px solid var(--line); border-radius: 10px; background: var(--white); }
      .mobile-toc summary { cursor: pointer; color: var(--accent-dark); font-weight: 750; }
      .mobile-toc .toc { position: static; max-height: none; margin-top: 12px; padding: 0; }
      article > h1 { margin-bottom: 26px; font-size: clamp(2.35rem, 12vw, 3.7rem); }
      h2 { margin-top: 56px; }
      .topbar { padding: 0 16px; }
      .brand span { display: none; }
      .password-row { display: grid; }
    }
    @media print {
      body { background: #fff; color: #000; font-size: 10.5pt; }
      .topbar, .toc-panel, .mobile-toc, .footer { display: none !important; }
      .reading-layout { display: block; max-width: none; padding: 0; }
      article { max-width: none; }
      article > h1 { font-size: 30pt; }
      h2 { break-after: avoid; margin-top: 30pt; }
      h3, table { break-inside: avoid; }
      .table-shell { overflow: visible; border-color: #bbb; box-shadow: none; }
      table { min-width: 0; font-size: 8.5pt; }
      a { color: inherit; text-decoration: none; }
      .recommendation-block { background: transparent !important; }
    }
  </style>
</head>
<body>
  <main class="login" id="login">
    <section class="login-card" aria-labelledby="login-title">
      <p class="eyebrow">Private document</p>
      <h1 id="login-title">Family strategy</h1>
      <p class="login-copy">Enter the shared password to read the current strategy and supporting calculations.</p>
      <form id="unlock-form">
        <label for="password">Password</label>
        <div class="password-row">
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
          <button id="unlock" type="submit">Open document</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
      <p class="privacy-note">This is a lightly protected family working document. Do not forward the link or password.</p>
    </section>
  </main>

  <div class="reader" id="reader" hidden>
    <header class="topbar">
      <div class="brand"><strong>Family strategy</strong><span>Updated 12 September 2026</span></div>
      <button class="lock-button" id="lock" type="button">Lock</button>
    </header>
    <div class="reading-layout">
      <aside class="toc-panel"><nav class="toc" id="desktop-toc" aria-label="Contents"></nav></aside>
      <article id="content">
        <details class="mobile-toc"><summary>Contents</summary><nav class="toc" id="mobile-toc" aria-label="Contents"></nav></details>
      </article>
    </div>
  </div>

      iterations: 310000
    };
    const fromB64 = value => Uint8Array.from(atob(value), character => character.charCodeAt(0));
    const escapeText = value => value.replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[character]));

    async function decrypt(password) {
      const material = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
      );
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: fromB64(payload.salt), iterations: payload.iterations, hash: 'SHA-256' },
        material,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      const clear = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: fromB64(payload.iv), tagLength: 128 },
        key,
        fromB64(payload.data)
      );
      return new TextDecoder().decode(clear);
    }

    function enhanceDocument(fragment) {
      const content = document.getElementById('content');
      content.insertAdjacentHTML('beforeend', fragment);

      content.querySelectorAll('table').forEach(table => {
        const shell = document.createElement('div');
        shell.className = 'table-shell';
        table.parentNode.insertBefore(shell, table);
        shell.appendChild(table);
      });

      content.querySelectorAll('p').forEach(paragraph => {
        const label = paragraph.querySelector(':scope > strong:first-child');
        if (!label) return;
        const kind = label.textContent.trim().replace(':', '').toLowerCase();
        if (!['answer', 'why', 'impact', 'action', 'detail'].includes(kind)) return;
        const wrapper = document.createElement('div');
        wrapper.className = 'recommendation-block ' + kind;
        paragraph.parentNode.insertBefore(wrapper, paragraph);
        wrapper.appendChild(paragraph);
      });

      content.querySelectorAll('a[href^="http"]').forEach(link => {
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      });

      const headings = [...content.querySelectorAll('h2, h3')];
      const list = document.createElement('ol');
      headings.forEach((heading, index) => {
        if (!heading.id) heading.id = 'section-' + (index + 1);
        const item = document.createElement('li');
        item.className = 'level-' + heading.tagName.substring(1);
        item.innerHTML = '<a href="#' + escapeText(heading.id) + '">' + escapeText(heading.textContent) + '</a>';
        list.appendChild(item);
      });
      const title = '<p class="toc-title">Contents</p>';
      document.getElementById('desktop-toc').innerHTML = title;
      document.getElementById('desktop-toc').appendChild(list);
      document.getElementById('mobile-toc').innerHTML = title + list.outerHTML;

      const footer = document.createElement('p');
      footer.className = 'footer';
      footer.textContent = 'Private family working document · Updated 12 September 2026';
      content.appendChild(footer);
    }

    document.getElementById('unlock-form').addEventListener('submit', async event => {
      event.preventDefault();
      const input = document.getElementById('password');
      const button = document.getElementById('unlock');
      const status = document.getElementById('status');
      button.disabled = true;
      status.textContent = 'Opening…';
      try {
        const fragment = await decrypt(input.value);
        input.value = '';
        enhanceDocument(fragment);
        document.getElementById('login').hidden = true;
        document.getElementById('reader').hidden = false;
        document.title = 'Chua family cash-flow and succession strategy';
        window.scrollTo(0, 0);
      } catch (error) {
        status.textContent = 'That password did not work. Please try again.';
        input.select();
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById('lock').addEventListener('click', () => location.reload());
  </script>
